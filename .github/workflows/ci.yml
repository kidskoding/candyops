name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests + dbt parse (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group dbt
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Dashboard JSON matches its generator
        run: |
          uv run python scripts/build_dashboard.py
          git diff --exit-code -- dashboards/
      - name: dbt project parses
        working-directory: dbt
        env:
          DATABRICKS_HOST: parse-only
          DBT_HTTP_PATH: parse-only
          DATABRICKS_TOKEN: parse-only
        run: uv run dbt parse --profiles-dir profiles

  dbt-build:
    name: dbt build on Databricks (CI schema)
    if: vars.DATABRICKS_HOST != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dbt-ci
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_SCHEMA: candyops_ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: databricks/setup-cli@main
      - run: uv sync --locked --group dbt
      - name: Find the SQL warehouse and the deployed bronze tables
        id: ws
        run: |
          id=$(databricks warehouses list -o json | jq -r '.[] | select(.name == "Serverless Starter Warehouse") | .id')
          echo "DBT_HTTP_PATH=/sql/1.0/warehouses/$id" >> "$GITHUB_ENV"
          echo "bronze=$(databricks tables exists workspace.candyops.bronze_off_products -o json | jq -r .table_exists)" >> "$GITHUB_OUTPUT"
      - name: dbt build from the deployed bronze tables
        if: steps.ws.outputs.bronze == 'true'
        working-directory: dbt
        run: uv run dbt build --profiles-dir profiles --vars '{bronze_schema: candyops}'
      - name: Skip until the first deploy has loaded bronze
        if: steps.ws.outputs.bronze != 'true'
        run: echo "::notice::workspace.candyops.bronze_off_products does not exist yet; dbt build skipped"
