# databricks bundle deploy -t dev && databricks bundle run -t dev candyops_pipeline
bundle:
  name: candyops

variables:
  catalog:
    description: Unity Catalog catalog for all CandyOps tables
    default: workspace
  schema:
    description: Project schema (bronze_*, silver_*, gold_* tables and the raw volume)
    default: candyops
  warehouse_id:
    description: SQL warehouse that runs dbt and the dashboard queries
    lookup:
      warehouse: Serverless Starter Warehouse

resources:
  dashboards:
    candyops_dashboard:
      display_name: CandyOps Allergy-Safe Halloween Candy
      file_path: ./dashboards/candyops.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
  jobs:
    candyops_pipeline:
      name: candyops-pipeline
      max_concurrent_runs: 1
      # daily, after Open Food Facts posts the previous day's change file (~06:30 UTC); paused in dev mode
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: UTC
      environments:
        - environment_key: dbt
          spec:
            client: "2"
            dependencies:
              - dbt-databricks>=1.10,<1.11
      tasks:
        - task_key: kaggle_to_bronze
          notebook_task:
            notebook_path: ./notebooks/01_kaggle_to_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: change_feed_to_bronze
          notebook_task:
            notebook_path: ./notebooks/01b_change_feed_to_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: dbt_build
          depends_on:
            - task_key: kaggle_to_bronze
            - task_key: change_feed_to_bronze
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands:
              - dbt build
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}
        - task_key: mlflow_summary
          depends_on:
            - task_key: dbt_build
          notebook_task:
            notebook_path: ./notebooks/02_mlflow_and_summary.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: candyops_dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
