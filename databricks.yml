# databricks bundle deploy -t dev && databricks bundle run -t dev candyops_pipeline
bundle:
  name: candyops

variables:
  catalog:
    description: Unity Catalog catalog for all CandyOps tables
    default: workspace
  schema:
    description: Project schema (only bronze_*, silver_*, gold_* tables are written here)
    default: candyops

resources:
  jobs:
    candyops_pipeline:
      name: candyops-pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: sources_and_bronze
          notebook_task:
            notebook_path: ./notebooks/01_sources_and_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: silver_and_quality
          depends_on:
            - task_key: sources_and_bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver_and_quality.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              fail_on_error: "true"
        - task_key: gold_and_scenarios
          depends_on:
            - task_key: silver_and_quality
          notebook_task:
            notebook_path: ./notebooks/03_gold_and_scenarios.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
