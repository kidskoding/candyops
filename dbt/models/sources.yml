version: 2

sources:
  - name: bronze
    description: Raw Kaggle files loaded unchanged, as strings, by notebooks/01_kaggle_to_bronze.py
    schema: "{{ var('bronze_schema', target.schema) }}"  # CI builds into its own schema from prod bronze
    tables:
      - name: bronze_off_products
        description: Open Food Facts world-food-facts v5 (ODbL), all 163 columns
      - name: bronze_candy_ranking
        description: FiveThirtyEight Ultimate Halloween Candy Power Ranking v1 (MIT)
      - name: bronze_off_changes
        description: Open Food Facts daily change feed, appended once per file by Auto Loader
      - name: bronze_off_change_files
        description: Change-feed files archived in the volume (from_ts and to_ts parsed from the file name)
