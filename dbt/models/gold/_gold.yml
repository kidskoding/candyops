version: 2

models:
  - name: gold_candy_allergens
    description: Allergen status per candy, from matched products with an ingredient list
    tests:
      - unique_combination: {arguments: {columns: [vintage, candy, allergen]}}
    columns:
      - name: status
        tests:
          - not_null
          - accepted_values: {arguments: {values: [contains, varies, may_contain, not_listed, unknown]}}
  - name: gold_candy_profile
    description: One row per ranked candy (coins excluded) with popularity, sugar and allergen statuses
    columns:
      - name: candy
        tests: [unique, not_null]
  - name: gold_bowls
    description: Top candies per restriction, ranked by popularity
    tests:
      - unique_combination: {arguments: {columns: [restriction, bowl_rank]}}
  - name: gold_bowl_summary
    description: One row per restriction with the share of the best bowl's popularity it keeps
    columns:
      - name: restriction
        tests: [unique, not_null]
      - name: popularity_kept_pct
        tests: [not_null, {value_between: {arguments: {min: 0, max: 100}}}]
  - name: gold_match_methods
    description: Name-only matching versus the curated rules
  - name: gold_data_quality
    description: Row counts and gaps found while cleaning
  - name: gold_label_changes
    description: Allergen status per candy in the 2017 snapshot versus the products edited since the feed started
    tests:
      - unique_combination: {arguments: {columns: [candy, allergen]}}
    columns:
      - name: comparison
        tests:
          - accepted_values: {arguments: {values: [unchanged, changed, newly_covered, not_enough_current_data]}}
  - name: gold_warning_cost
    description: Each restricted bowl with and without accepting "may contain" warnings
    columns:
      - name: restriction
        tests: [unique, not_null]
      - name: warning_cost_pct
        tests: [not_null, {value_between: {arguments: {min: 0, max: 100}}}]
  - name: gold_safe_swaps
    description: The most similar safe candy for each unrestricted-bowl favorite a restriction removes
    tests:
      - unique_combination: {arguments: {columns: [restriction, favorite]}}
  - name: gold_allergy_safe_candies
    description: Candies a kid with each allergy can eat, under the same rules as the bowls
    tests:
      - unique_combination: {arguments: {columns: [allergen, candy]}}
