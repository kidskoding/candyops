[project]
name = "candyops"
version = "0.1.0"
description = "CandyOps — Halloween manufacturing analytics with Databricks (synthetic demo)"
authors = [
    { name = "Anirudh Konidala", email = "anirudhkonidala@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
spark = [
    "delta-spark>=4.0,<4.1",
    "pyspark>=4.0,<4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
