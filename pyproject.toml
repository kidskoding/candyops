[project]
name = "candyops"
version = "0.1.0"
description = "CandyOps — Halloween manufacturing analytics with Databricks (synthetic demo)"
authors = [
    { name = "Anirudh Konidala", email = "anirudhkonidala@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
spark = [
    "delta-spark>=4.0,<4.1",
    "pyspark>=4.0,<4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks injects spark/dbutils/display; imports follow the sys.path setup cell
"notebooks/*" = ["F821", "E402", "E501"]
"scripts/*" = ["E402"]
# Markdown report template
"scripts/run_local.py" = ["E402", "E501"]
