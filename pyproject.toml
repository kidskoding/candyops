[project]
name = "candyops"
version = "0.1.0"
description = "candyops: allergy-safe Halloween candy picks from Kaggle data, built with Databricks and dbt"
authors = [
    { name = "Anirudh Konidala", email = "anirudhkonidala@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "kagglehub>=1.0.3,<2",
]
# shortcut: dbt-core 1.12 needs dbt-core-experimental-parser, which fails to build here; retry when it ships wheels
dbt = [
    "dbt-databricks>=1.10,<1.11",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks injects spark/dbutils/display; imports follow the sys.path setup cell
"notebooks/*" = ["F821", "E402", "E501"]
"scripts/*" = ["E402"]
"scripts/build_dashboard.py" = ["E501"]
